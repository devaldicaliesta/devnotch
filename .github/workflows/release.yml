name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag rilis, misalnya v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Pasang toolchain dari rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cocokkan tag dengan versi Cargo
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'notchi').version
          if ("v$version" -ne $env:TAG) {
            Write-Error "Tag $env:TAG tidak cocok dengan versi Cargo v$version"
            exit 1
          }

      - name: Uji
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked -p notchi

      - name: Uji jalan exe
        run: |
          $p = Start-Process -FilePath target/release/Notchi.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "Notchi.exe --version keluar dengan kode $($p.ExitCode)"
            exit 1
          }

      - name: Kemas
        run: |
          $name = "Notchi-$env:TAG-windows-x64"
          New-Item -ItemType Directory -Force dist, "stage/$name" | Out-Null
          Copy-Item target/release/Notchi.exe "dist/$name.exe"
          Copy-Item target/release/Notchi.exe, README.md, LICENSE, NOTICE, LICENSE-ASSETS.md, TRADEMARKS.md "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding utf8NoBOM dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Terbitkan ke GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # API GitHub kadang membalas 5xx sesaat; ulangi dengan jeda 2, 4, 8, 16 detik.
          # Bila rilis sudah sempat dibuat sebagian, percobaan berikutnya mengunggah ulang aset.
          $assets = (Get-ChildItem dist -File).FullName
          $notes = "docs/rilis/$env:TAG.md"
          $body = if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          for ($i = 0; $i -lt 5; $i++) {
            if ($i -gt 0) {
              $wait = [math]::Pow(2, $i)
              Write-Host "Percobaan ulang $i dalam $wait detik"
              Start-Sleep -Seconds $wait
            }
            gh release view $env:TAG *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $env:TAG @assets --clobber
            } else {
              gh release create $env:TAG @assets --title "Notchi $env:TAG" --target $env:GITHUB_SHA @body
            }
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          exit 1
